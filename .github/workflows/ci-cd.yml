name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: expense-tracker

jobs:
  lint:
    name: Code Quality (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install linter
        run: pip install ruff==0.6.9

      - name: Lint (ruff check)
        run: ruff check . --output-format=github

      - name: Check formatting (ruff format)
        run: ruff format --check --diff .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          mkdir -p reports
          pytest -v \
            --cov=app --cov-report=term-missing --cov-report=xml:reports/coverage.xml \
            --cov-fail-under=85 \
            --junitxml=reports/junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: reports/
          retention-days: 14

  build:
    name: Build Artifact (Docker image)
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t ${IMAGE_NAME}:${GITHUB_SHA::7} -t ${IMAGE_NAME}:latest .
          docker image ls ${IMAGE_NAME}

      - name: Package artifact
        run: |
          mkdir -p dist
          docker save ${IMAGE_NAME}:latest | gzip > dist/${IMAGE_NAME}-image.tar.gz
          tar -czf dist/${IMAGE_NAME}-src.tar.gz app wsgi.py requirements.txt Dockerfile README.md
          cat > dist/build-info.json <<EOF
          {
            "app": "${IMAGE_NAME}",
            "commit": "${GITHUB_SHA}",
            "branch": "${GITHUB_REF_NAME}",
            "run_number": ${GITHUB_RUN_NUMBER},
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          ls -lh dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-build
          path: dist/
          retention-days: 7

  deploy-test:
    name: Deploy to Test Environment
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: test
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: expense-tracker-build
          path: deploy

      - name: Check artifact
        run: |
          ls -lh deploy
          test -f deploy/${IMAGE_NAME}-image.tar.gz
          test -f deploy/build-info.json
          cat deploy/build-info.json

      - name: Load image and start container
        run: |
          docker load < deploy/${IMAGE_NAME}-image.tar.gz
          docker run -d --name expense-test -p 8000:8000 \
            -e APP_ENV=test -e APP_VERSION=1.0.${GITHUB_RUN_NUMBER} \
            ${IMAGE_NAME}:latest

      - name: Wait for health check
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health; then echo; echo "Service is up"; exit 0; fi
            sleep 1
          done
          docker logs expense-test
          exit 1

      - name: Smoke tests
        run: |
          set -e
          curl -fs -X POST http://localhost:8000/api/expenses \
            -H "Content-Type: application/json" \
            -d '{"amount": 1200, "category": "food", "description": "smoke test", "spent_on": "2026-10-01"}'
          echo
          curl -fs http://localhost:8000/api/summary | tee summary.json
          echo
          python3 -c "import json; s = json.load(open('summary.json')); assert s['count'] == 1 and s['total'] == 1200.0"
          curl -fs http://localhost:8000/ | grep -q "ExpenseTracker"
          echo "Smoke tests passed"

      - name: Deployment summary
        run: |
          {
            echo "### Deploy to test: OK"
            echo ""
            echo "| Параметр | Значение |"
            echo "|---|---|"
            echo "| Образ | ${IMAGE_NAME}:latest |"
            echo "| Коммит | ${GITHUB_SHA::7} |"
            echo "| Health | $(curl -fs http://localhost:8000/health) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Container logs
        if: always()
        run: docker logs expense-test || true

      - name: Stop test environment
        if: always()
        run: docker rm -f expense-test || true
